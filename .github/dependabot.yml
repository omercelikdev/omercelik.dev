# Dependency currency is automated, not remembered. Groups take minor and
# patch updates together; a MAJOR arrives as its own pull request — a major
# is a decision with a migration story, not a batch item, and a closed one
# isn't recreated. GitHub Actions are grouped whole (CI proves them).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Next.js and its ESLint config are released together; move them together.
      nextjs:
        patterns: ["next", "eslint-config-next"]
        update-types: [minor, patch]
      dependencies:
        dependency-type: production
        update-types: [minor, patch]
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    # Majors held on purpose. Each note says when to lift the hold.
    ignore:
      # Types follow the Node runtime (.nvmrc): move them with a Node upgrade.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # eslint-config-next's plugins don't run on ESLint 10 yet
      # (eslint-plugin-react crashes). Lift once eslint-config-next supports it.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # typescript-eslint (via eslint-config-next) supports TypeScript < 6.1.
      # Lift once it supports the next major.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
